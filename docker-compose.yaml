services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-graphRAG
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ${PWD}/qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:latest
    container_name: neo4j-graphRAG
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - ${PWD}/neo4j_data:/data
    restart: unless-stopped

  # Ollama (раскомментирован для работы с Open WebUI)
  ollama:
    image: ollama/ollama:latest
    container_name: gr_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  # Open WebUI
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"                 # Веб-интерфейс на порту 3000
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434   # Адрес Ollama внутри сети
      - WEBUI_SECRET_KEY=your-secret-key-here # Рекомендуется сменить на свой
    volumes:
      - open-webui-data:/app/backend/data      # Том для хранения данных
    depends_on:
      - ollama                                 # Ждём, пока ollama запустится
    restart: unless-stopped

volumes:
  qdrant_data:
  neo4j_data:
  ollama_models:
  open-webui-data:       # Новый том для Open WebUI